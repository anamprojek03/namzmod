<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wheel of Namz New Era</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            background: linear-gradient(180deg, #dbeafe 0%, #ffffff 100%); 
            color: #1f2937; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            overflow-x: hidden;
        }
        .wheel-container { position: relative; width: 350px; height: 350px; margin: 0 auto; }
        canvas { width: 100%; height: 100%; }
        .pointer {
            position: absolute; top: 50%; right: -35px; transform: translateY(-50%);
            width: 0; height: 0; border-top: 15px solid transparent;
            border-bottom: 15px solid transparent; border-right: 25px solid #fcd34d;
            z-index: 10; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }
        .spin-button {
            position: absolute; inset: 0; margin: auto;
            width: 80px; height: 80px; background: white;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: #1f2937; cursor: pointer; text-align: center;
            font-size: 14px; line-height: 1.2; z-index: 20; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        .spin-button:active { transform: scale(0.95); }
        .admin-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            z-index: 50; display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(3px);
        }
        .hidden { display: none !important; }
        .admin-input-group {
            display: flex; gap: 8px; align-items: center;
            background: #f3f4f6; padding: 6px 10px; border-radius: 8px;
            border: 1px solid #e5e7eb;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header Navigasi -->
    <header class="bg-white shadow-sm border-b border-gray-200 p-2 flex items-center justify-between sticky top-0 z-40">
        <div class="flex items-center gap-3 text-gray-700">
            <button class="text-xl p-1"><i class="fa-solid fa-xmark"></i></button>
            <button class="text-lg p-1"><i class="fa-solid fa-chevron-down"></i></button>
            <div class="flex flex-col">
                <span class="font-semibold text-sm leading-tight">Wheel of Na...</span>
                <span class="text-xs text-gray-500">wheelofnames.com</span>
            </div>
        </div>
        <div class="flex items-center gap-3 text-gray-600 text-lg pr-2">
            <button class="p-1"><i class="fa-solid fa-share-nodes"></i></button>
            <button class="p-1"><i class="fa-regular fa-bookmark"></i></button>
            <!-- Tombol Titik Tiga untuk Membuka Admin -->
            <button onclick="toggleAdmin()" class="p-1 text-xl hover:text-blue-600 transition"><i class="fa-solid fa-ellipsis-vertical"></i></button>
        </div>
    </header>

    <!-- Bar Kontrol Entri -->
    <div class="bg-gray-50 border-b border-gray-200 px-4 py-2 flex items-center gap-3 sticky top-[57px] z-30">
        <button onclick="toggleAdmin()" class="text-blue-600 text-sm w-8 h-8 flex items-center justify-center rounded-full bg-blue-100 border border-blue-200 hover:bg-blue-200 transition">
            <i class="fa-solid fa-pencil"></i>
        </button>
        <div class="flex items-center gap-2 text-sm flex-1 text-gray-700">
            <div class="bg-white border border-gray-300 rounded px-3 py-1.5 w-full text-xs flex justify-between">
                <span>Entries: <strong id="entriesCount">0</strong></span>
                <span class="text-gray-400">Results: 0</span>
            </div>
        </div>
    </div>

    <!-- Area Roda Spin -->
    <main class="flex-1 flex flex-col items-center justify-center p-6 mt-6">
        <div class="wheel-container">
            <div class="pointer"></div>
            <canvas id="wheelCanvas"></canvas>
            <div onclick="spinWheel()" class="spin-button">Tap<br>to spin</div>
        </div>
    </main>

    <!-- Modal Admin Panel (Tersembunyi, Muncul saat Titik Tiga diklik) -->
    <div id="adminOverlay" class="admin-overlay hidden p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md p-6 relative border border-gray-200">
            <button onclick="toggleAdmin()" class="absolute top-3 right-4 text-gray-400 hover:text-gray-600 text-lg"><i class="fa-solid fa-xmark"></i></button>
            
            <h2 class="text-lg font-bold text-gray-800 mb-1"><i class="fa-solid fa-gear text-blue-600 mr-2"></i>Admin Panel Roda</h2>
            <p class="text-xs text-gray-500 mb-4">Atur nama peserta, warna, dan persentase kemenangan (total harus 100%).</p>

            <!-- Indikator Total Persentase -->
            <div id="totalStatus" class="mb-3 p-2.5 rounded-lg text-xs flex justify-between items-center font-medium border bg-gray-50">
                <span>Total Persentase: <strong id="totalPercentDisplay">0%</strong></span>
                <span id="statusIcon"></span>
            </div>
            
            <!-- List Input Peserta -->
            <div id="adminInputs" class="space-y-2 max-h-56 overflow-y-auto pr-1 mb-4"></div>

            <div class="flex gap-2">
                <button onclick="addParticipant()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 py-2.5 rounded-lg text-xs font-semibold flex items-center justify-center gap-1 border border-gray-300">
                    <i class="fa-solid fa-plus"></i> Tambah
                </button>
                <button onclick="saveSettings()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg text-xs font-bold flex items-center justify-center gap-1 shadow-md">
                    <i class="fa-solid fa-floppy-disk"></i> Simpan
                </button>
            </div>
        </div>
    </div>

    <script>
        // Data Default Roda
        const defaultItems = [
            { name: "Ali", percentage: 12.5, color: "#3b82f6" },
            { name: "Beatriz", percentage: 12.5, color: "#ef4444" },
            { name: "Charles", percentage: 12.5, color: "#f59e0b" },
            { name: "Diya", percentage: 12.5, color: "#10b981" },
            { name: "Eric", percentage: 12.5, color: "#3b82f6" },
            { name: "Fatima", percentage: 12.5, color: "#ef4444" },
            { name: "Gabriel", percentage: 12.5, color: "#f59e0b" },
            { name: "Hanna", percentage: 12.5, color: "#10b981" }
        ];

        let items = JSON.parse(localStorage.getItem('wheel_namz_data')) || defaultItems;

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 800;
        canvas.height = 800;
        const outsideRadius = 350;
        const textRadius = 280;
        const insideRadius = 40;

        let startAngle = 0;
        let isSpinning = false;

        function drawWheel() {
            const totalSlices = items.length;
            if (totalSlices === 0) return;
            const arcSize = (2 * Math.PI) / totalSlices;
            const center = canvas.width / 2;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.font = "bold 28px 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif";
            ctx.textBaseline = "middle";
            ctx.textAlign = "center";

            items.forEach((item, i) => {
                const angle = startAngle + i * arcSize;
                
                ctx.fillStyle = item.color || '#3b82f6';
                ctx.beginPath();
                ctx.arc(center, center, outsideRadius, angle, angle + arcSize, false);
                ctx.arc(center, center, insideRadius, angle + arcSize, angle, true);
                ctx.fill();
                ctx.strokeStyle = "white";
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.save();
                ctx.fillStyle = "white";
                const textAngle = angle + arcSize / 2;
                ctx.translate(
                    center + Math.cos(textAngle) * textRadius,
                    center + Math.sin(textAngle) * textRadius
                );
                ctx.rotate(textAngle + Math.PI / 2); 
                ctx.fillText(item.name, 0, 0);
                ctx.restore();
            });

            document.getElementById('entriesCount').innerText = totalSlices;
        }

        function spinWheel() {
            if (isSpinning || items.length < 2) return;
            isSpinning = true;
            
            const totalPercentage = items.reduce((sum, item) => sum + parseFloat(item.percentage || 0), 0);
            if (totalPercentage <= 0) { alert("Total persentase harus lebih dari 0!"); isSpinning = false; return; }

            const rand = Math.random() * totalPercentage;
            let currentSum = 0;
            let winningIndex = 0;
            for(let i = 0; i < items.length; i++) {
                currentSum += parseFloat(items[i].percentage || 0);
                if (rand <= currentSum) {
                    winningIndex = i;
                    break;
                }
            }

            const totalSlices = items.length;
            const arcSize = (2 * Math.PI) / totalSlices;
            const targetAngle = 1.5 * Math.PI - (winningIndex * arcSize + arcSize / 2);
            
            let spinAngleStart = 25 + Math.random() * 10;
            let spinTimeTotal = 4000;
            let startTime = Date.now();

            function animate() {
                let now = Date.now();
                let elapsed = now - startTime;
                let progress = Math.min(elapsed / spinTimeTotal, 1);
                let easeProgress = 1 - Math.pow(1 - progress, 3);
                
                if (progress < 1) {
                    let currentSpeed = spinAngleStart * (1 - easeProgress);
                    startAngle += (currentSpeed * Math.PI / 180);
                    drawWheel();
                    requestAnimationFrame(animate);
                } else {
                    startAngle = targetAngle;
                    drawWheel();
                    isSpinning = false;
                    alert(`🎉 Pemenangnya Adalah: ${items[winningIndex].name} !`);
                }
            }
            requestAnimationFrame(animate);
        }

        const adminOverlay = document.getElementById('adminOverlay');
        const adminInputs = document.getElementById('adminInputs');

        function toggleAdmin() {
            adminOverlay.classList.toggle('hidden');
            if (!adminOverlay.classList.contains('hidden')) {
                renderAdminInputs();
            }
        }

        function renderAdminInputs() {
            adminInputs.innerHTML = '';
            items.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'admin-input-group';
                div.innerHTML = `
                    <input type="color" value="${item.color}" oninput="items[${index}].color = this.value" class="w-7 h-7 border-0 bg-transparent cursor-pointer rounded">
                    <input type="text" value="${item.name}" oninput="items[${index}].name = this.value" placeholder="Nama" class="flex-1 bg-white border border-gray-300 px-2.5 py-1.5 rounded text-xs focus:outline-none focus:border-blue-500">
                    <input type="number" step="any" value="${item.percentage}" oninput="items[${index}].percentage = this.value; updatePercentageTotal();" placeholder="%" class="w-16 bg-white border border-gray-300 px-2 py-1.5 rounded text-xs text-center focus:outline-none focus:border-blue-500">
                    <span class="text-xs text-gray-500">%</span>
                    <button onclick="removeParticipant(${index})" class="text-rose-500 hover:text-rose-700 px-1.5 text-xs"><i class="fa-solid fa-trash"></i></button>
                `;
                adminInputs.appendChild(div);
            });
            updatePercentageTotal();
        }

        function updatePercentageTotal() {
            let total = items.reduce((sum, item) => sum + parseFloat(item.percentage || 0), 0);
            document.getElementById('totalPercentDisplay').innerText = total + '%';
            let statusEl = document.getElementById('statusIcon');
            if (total === 100) {
                statusEl.innerHTML = '<span class="text-emerald-600 font-semibold"><i class="fa-solid fa-circle-check"></i> Sempurna</span>';
            } else {
                statusEl.innerHTML = '<span class="text-amber-600 font-semibold"><i class="fa-solid fa-triangle-exclamation"></i> Belum 100%</span>';
            }
        }

        function addParticipant() {
            const colors = ['#3b82f6', '#ef4444', '#f59e0b', '#10b981', '#8b5cf6', '#ec4899'];
            items.push({ name: "Baru", percentage: 10, color: colors[items.length % colors.length] });
            renderAdminInputs();
        }

        function removeParticipant(index) {
            if (items.length > 2) {
                items.splice(index, 1);
                renderAdminInputs();
            } else {
                alert('Minimal harus ada 2 peserta!');
            }
        }

        function saveSettings() {
            localStorage.setItem('wheel_namz_data', JSON.stringify(items));
            toggleAdmin();
            drawWheel();
        }

        drawWheel();
    </script>
</body>
</html>
