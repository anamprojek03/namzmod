<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wheel of Namz New Era</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Styling Utama Meniru Referensi */
        body { 
            background: linear-gradient(180deg, #dbeafe 0%, #ffffff 100%); 
            color: #1f2937; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            overflow-x: hidden;
        }
        /* Container Roda */
        .wheel-container { position: relative; width: 350px; height: 350px; margin: 0 auto; }
        canvas { width: 100%; height: 100%; }
        /* Penunjuk (Pointer) Segitiga */
        .pointer {
            position: absolute; top: 50%; right: -35px; transform: translateY(-50%);
            width: 0; height: 0; border-top: 15px solid transparent;
            border-bottom: 15px solid transparent; border-right: 25px solid #fcd34d;
            z-index: 10; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }
        /* Tombol Tengah */
        .spin-button {
            position: absolute; inset: 0; margin: auto;
            width: 80px; height: 80px; background: white;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: #1f2937; cursor: pointer; text-align: center;
            font-size: 14px; line-height: 1.2; z-index: 20; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        .spin-button:active { transform: scale(0.95); }
        /* Overlay Admin Panel */
        .admin-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            z-index: 50; display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(3px);
        }
        .hidden { display: none !important; }
        
        /* Style untuk input admin */
        .admin-input-group {
            display: flex; gap: 10px; align-items: center;
            background: #f3f4f6; padding: 8px; border-radius: 8px;
            border: 1px solid #e5e7eb;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-white shadow-sm border-b border-gray-200 p-2 flex items-center justify-between sticky top-0 z-40">
        <div class="flex items-center gap-3 text-gray-700">
            <button class="text-xl p-1"><i class="fa-solid fa-xmark"></i></button>
            <button class="text-lg p-1"><i class="fa-solid fa-chevron-down"></i></button>
            <div class="flex flex-col">
                <span class="font-semibold text-sm leading-tight">Wheel of Na...</span>
                <span class="text-xs text-gray-500">wheelofnames.com</span>
            </div>
        </div>
        <div class="flex items-center gap-3 text-gray-600 text-lg pr-2">
            <button class="p-1"><i class="fa-solid fa-share-nodes"></i></button>
            <button class="p-1"><i class="fa-regular fa-bookmark"></i></button>
            <button onclick="toggleAdmin()" class="p-1 text-xl" id="adminDots"><i class="fa-solid fa-ellipsis-vertical"></i></button>
        </div>
    </header>

    <div class="bg-gray-50 border-b border-gray-200 px-4 py-2 flex items-center gap-3 sticky top-[57px] z-30">
        <button onclick="toggleAdmin()" class="text-blue-600 text-sm w-8 h-8 flex items-center justify-center rounded-full bg-blue-100 border border-blue-200">
            <i class="fa-solid fa-pencil"></i>
        </button>
        <div class="flex items-center gap-2 text-sm flex-1 text-gray-700">
            <div class="bg-white border border-gray-300 rounded px-3 py-1.5 w-full text-xs flex justify-between">
                <span>Entries: <strong id="entriesCount">0</strong></span>
                <span class="text-gray-400">Results: 0</span>
            </div>
        </div>
    </div>

    <main class="flex-1 flex flex-col items-center justify-center p-6 mt-10">
        <div class="wheel-container">
            <div class="pointer"></div>
            <canvas id="wheelCanvas"></canvas>
            <div onclick="spinWheel()" class="spin-button">Tap<br>to spin</div>
        </div>
    </main>

    <div id="adminOverlay" class="admin-overlay hidden p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md p-6 relative border border-gray-200 animate__animated animate__fadeInDown animate__faster">
            <button onclick="toggleAdmin()" class="absolute top-3 right-4 text-gray-400 hover:text-gray-600 text-lg"><i class="fa-solid fa-xmark"></i></button>
            
            <h2 class="text-lg font-bold text-gray-800 mb-1"><i class="fa-solid fa-gear text-blue-600 mr-2"></i>Pengaturan Roda</h2>
            <p class="text-xs text-gray-500 mb-5">Atur nama peserta dan persentase peluang menang (total wajib 100%).</p>

            <div id="totalStatus" class="mb-3 p-3 rounded-lg text-xs flex justify-between items-center font-medium border">
                <span>Total Persentase: <strong id="totalPercentDisplay">0%</strong></span>
                <span id="statusIcon"></span>
            </div>
            
            <div id="adminInputs" class="space-y-2 max-h-60 overflow-y-auto pr-2 mb-5">
                </div>

            <div class="flex gap-3">
                <button onclick="addInput()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 py-2.5 rounded-lg text-sm font-medium flex items-center justify-center gap-2 border border-gray-300">
                    <i class="fa-solid fa-plus text-xs"></i> Tambah Peserta
                </button>
                <button onclick="saveSettings()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg text-sm font-medium flex items-center justify-center gap-2 shadow-md">
                    <i class="fa-solid fa-floppy-disk text-xs"></i> Simpan & Mainkan
                </button>
            </div>
        </div>
    </div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <script>
        // 1. Data Default (Meniru Gambar)
        const defaultItems = [
            { name: "Ali", percentage: 12.5, color: "#3b82f6" }, // Biru
            { name: "Beatriz", percentage: 12.5, color: "#ef4444" }, // Merah
            { name: "Charles", percentage: 12.5, color: "#f59e0b" }, // Kuning
            { name: "Diya", percentage: 12.5, color: "#10b981" }, // Hijau
            { name: "Eric", percentage: 12.5, color: "#3b82f6" }, // Biru
            { name: "Fatima", percentage: 12.5, color: "#ef4444" }, // Merah
            { name: "Gabriel", percentage: 12.5, color: "#f59e0b" }, // Kuning
            { name: "Hanna", percentage: 12.5, color: "#10b981" }  // Hijau
        ];

        // Load Data dari LocalStorage atau pakai default
        let items = JSON.parse(localStorage.getItem('wheel_namz_data')) || defaultItems;

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        // Ukuran canvas lebih besar untuk resolusi retina
        canvas.width = 800;
        canvas.height = 800;
        const outsideRadius = 350;
        const textRadius = 280;
        const insideRadius = 40;

        let startAngle = 0;
        let isSpinning = false;
        let spinTimeout = null;
        let spinTimeTotal = 4000; // 4 detik fix
        let spinAngleStart = 0;

        // 2. Fungsi Menggambar Roda
        function drawWheel() {
            const totalSlices = items.length;
            if (totalSlices === 0) return;
            const arcSize = (2 * Math.PI) / totalSlices;
            const center = canvas.width / 2;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Styling teks umum
            ctx.font = "bold 28px 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif";
            ctx.textBaseline = "middle";
            ctx.textAlign = "center";

            items.forEach((item, i) => {
                const angle = startAngle + i * arcSize;
                
                // Gambar Bagian (Slice)
                ctx.fillStyle = item.color;
                ctx.beginPath();
                ctx.arc(center, center, outsideRadius, angle, angle + arcSize, false);
                ctx.arc(center, center, insideRadius, angle + arcSize, angle, true);
                ctx.fill();
                // Garis pembatas
                ctx.strokeStyle = "white";
                ctx.lineWidth = 2;
                ctx.stroke();

                // Gambar Teks
                ctx.save();
                ctx.fillStyle = "white";
                // Trik memutar teks agar selalu menghadap keluar
                const textAngle = angle + arcSize / 2;
                ctx.translate(
                    center + Math.cos(textAngle) * textRadius,
                    center + Math.sin(textAngle) * textRadius
                );
                // Sesuaikan rotasi teks agar mudah dibaca dari kanan
                ctx.rotate(textAngle + Math.PI / 2); 
                ctx.fillText(item.name, 0, 0);
                ctx.restore();
            });

            // Update jumlah entri di header
            document.getElementById('entriesCount').innerText = totalSlices;
        }

        // 3. Fungsi Logika Penentuan Pemenang (Weighted Random)
        function spinWheel() {
            if (isSpinning || items.length < 2) return;
            isSpinning = true;
            
            // Hitung total persentase
            const totalPercentage = items.reduce((sum, item) => sum + parseFloat(item.percentage || 0), 0);
            if (totalPercentage <= 0) { alert("Total persentase harus lebih dari 0!"); isSpinning=false; return; }
            if (Math.round(totalPercentage) !== 100) { alert("Total persentase harus tepat 100% agar adil!"); }

            // Pilih angka acak dari 0 sampai total
            const rand = Math.random() * totalPercentage;
            
            // Tentukan pemenang berdasarkan bobot
            let currentSum = 0;
            let winningIndex = 0;
            for(let i=0; i < items.length; i++) {
                currentSum += parseFloat(items[i].percentage || 0);
                if (rand <= currentSum) {
                    winningIndex = i;
                    break;
                }
            }

            // Kecepatan awal putaran super kencang
            spinAngleStart = 25 + Math.random() * 10; 

            // Hitung sudut target agar jarum berhenti di tengah slice pemenang
            const totalSlices = items.length;
            const arcSize = (2 * Math.PI) / totalSlices;
            // Target sudut adalah di kanan (0 rad), sesuaikan dengan pointer
            const targetAngle = 1.5 * Math.PI - (winningIndex * arcSize + arcSize / 2);
            
            // Tambahkan putaran acak penuh agar terlihat muter kenceng
            let finalExtraSpins = (Math.floor(Math.random() * 2) + 5) * 2 * Math.PI; 
            
            // Animasi kustom untuk presisi akhir
            let startTime = Date.now();
            function animate() {
                let now = Date.now();
                let elapsed = now - startTime;
                let progress = Math.min(elapsed / spinTimeTotal, 1);
                
                // Easing - Ease Out Cubic
                let easeProgress = 1 - Math.pow(1 - progress, 3);
                
                if (progress < 1) {
                    // Hitung kecepatan saat ini berdasarkan easing
                    let currentSpeed = spinAngleStart * (1 - easeProgress);
                    // Update sudut roda
                    startAngle += (currentSpeed * Math.PI / 180);
                    drawWheel();
                    requestAnimationFrame(animate);
                } else {
                    // Di akhir putaran, lompat presisi ke target
                    startAngle = targetAngle;
                    drawWheel();
                    isSpinning = false;
                    alert(`🎉 Pemenangnya Adalah: ${items[winningIndex].name} !`);
                }
            }
            requestAnimationFrame(animate);
        }

        // 4. Fungsi Admin Panel
        const adminOverlay = document.getElementById('adminOverlay');
        const adminInputs = document.getElementById('adminInputs');
        const totalStatus = document.getElementById('totalStatus');
        const totalPercentDisplay = document.getElementById('totalPercentDisplay');
        const statusIcon = document.getElementById('statusIcon');

        function toggleAdmin() {
            adminOverlay.classList.toggle('hidden');
            if (!adminOverlay.classList.contains('hidden')) {
                renderAdminInputs();
                validateTotal();
            }
        }

        // Generate input form HTML
        function renderAdminInputs() {
            adminInputs.innerHTML = '';
            items.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'admin-input-group';
                div.innerHTML = `
                    <input type="color" value="${item.color}" onchange="updateItem(${index}, 'color', this.value)" class="w-8 h-8 border-0 bg-transparent cursor-pointer">
                    <input type="text" value="${item.name}" onchange="updateItem(${index},
