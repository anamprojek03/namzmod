<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Namz New Era - Lucky Spin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0f172a;
            color: #f8fafc;
        }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 relative overflow-x-hidden">

    <header class="w-full max-w-md flex justify-between items-center py-4 relative z-50">
        <div class="flex items-center space-x-2">
            <div class="w-3 h-3 rounded-full bg-cyan-400 animate-pulse"></div>
            <span class="font-bold text-lg tracking-wider text-cyan-400">NAMZ NEW ERA</span>
        </div>

        <div class="relative">
            <button onclick="toggleMenu()" class="p-2 rounded-xl glass hover:bg-slate-700 transition focus:outline-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01" />
                </svg>
            </button>

            <div id="dropdownMenu" class="hidden absolute right-0 mt-2 w-48 glass rounded-2xl shadow-2xl py-2 border border-slate-700">
                <button onclick="openAdmin()" class="w-full text-left px-4 py-2 text-sm text-slate-200 hover:bg-cyan-500/20 hover:text-cyan-400 flex items-center space-x-2 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    <span>Admin Panel</span>
                </button>
            </div>
        </div>
    </header>

    <main class="w-full max-w-md flex flex-col items-center my-auto py-6">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-purple-500 bg-clip-text text-transparent">Lucky Spin Hadiah</h1>
            <p class="text-xs text-slate-400 mt-1">Putar roda keberuntunganmu sekarang!</p>
        </div>

        <div class="relative w-72 h-72 flex items-center justify-center mb-8">
            <div class="absolute -top-3 z-30 w-0 h-0 border-l-[10px] border-l-transparent border-r-[10px] border-r-transparent border-t-[18px] border-t-cyan-400 filter drop-shadow"></div>
            
            <canvas id="wheel" width="300" height="300" class="w-full h-full rounded-full shadow-[0_0_25px_rgba(6,182,212,0.3)] border-4 border-slate-700/50 transition-transform duration-4000 cubic-bezier(0.15, 0.9, 0.2, 1)"></canvas>

            <button onclick="spinWheel()" id="spinBtn" class="absolute z-20 w-16 h-16 rounded-full bg-gradient-to-br from-cyan-500 to-blue-600 font-bold text-xs shadow-lg hover:scale-105 active:scale-95 transition flex items-center justify-center border-2 border-white/20">
                PUTAR
            </button>
        </div>

        <div id="resultBox" class="w-full glass p-4 rounded-2xl text-center hidden border border-cyan-500/30">
            <p class="text-xs text-slate-400">Selamat, Kamu Mendapatkan:</p>
            <h2 id="winnerText" class="text-lg font-bold text-cyan-300 mt-1">-</h2>
        </div>
    </main>

    <footer class="w-full max-w-md text-center py-4 text-xs text-slate-500">
        &copy; 2023 Namz New Era. All rights reserved.
    </footer>

    <div id="adminModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="glass w-full max-w-md p-6 rounded-3xl border border-slate-700 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h2 class="font-bold text-lg text-cyan-400">Pengaturan Admin</h2>
                <button onclick="closeAdmin()" class="text-slate-400 hover:text-white">&times;</button>
            </div>
            
            <p class="text-xs text-slate-400 mb-4">Atur nama hadiah dan persentase kemunculan (Total persentase harus 100%).</p>

            <div id="prizeInputs" class="space-y-3 mb-4">
                </div>

            <div class="flex justify-between items-center mb-6 text-xs bg-slate-800/50 p-3 rounded-xl">
                <span class="text-slate-300">Total Persentase: <strong id="totalPercentage" class="text-cyan-400">0%</strong></span>
                <span class="text-slate-300">Total Putaran: <strong id="totalSpins" class="text-purple-400">0</strong></span>
            </div>

            <div class="flex space-x-2">
                <button onclick="saveSettings()" class="flex-1 bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-bold py-2.5 rounded-xl text-sm transition">Simpan</button>
                <button onclick="resetDefault()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2.5 rounded-xl text-sm transition">Reset</button>
            </div>
        </div>
    </div>

    <script>
        // Data Default Hadiah & Persentase (Bobot)
        let defaultPrizes = [
            { name: "Diamond FF 50", weight: 10, color: "#06b6d4" },
            { name: "Terima Kasih", weight: 40, color: "#334155" },
            { name: "Akun Elite Pass", weight: 5, color: "#8b5cf6" },
            { name: "Voucher Diskon", weight: 25, color: "#0284c7" },
            { name: "Coba Lagi", weight: 20, color: "#475569" }
        ];

        let prizes = JSON.parse(localStorage.getItem('namz_prizes')) || defaultPrizes;
        let totalSpins = parseInt(localStorage.getItem('namz_total_spins')) || 0;

        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        let startAngle = 0;
        let isSpinning = false;

        // Toggle Dropdown Menu Titik Tiga
        function toggleMenu() {
            const menu = document.getElementById('dropdownMenu');
            menu.classList.toggle('hidden');
        }

        // Buka Admin Panel
        function openAdmin() {
            toggleMenu();
            document.getElementById('adminModal').classList.remove('hidden');
            renderAdminInputs();
        }

        // Tutup Admin Panel
        function closeAdmin() {
            document.getElementById('adminModal').classList.add('hidden');
        }

        // Render Inputan di Admin
        function renderAdminInputs() {
            const container = document.getElementById('prizeInputs');
            container.innerHTML = '';
            let totalP = 0;

            prizes.forEach((prize, index) => {
                totalP += prize.weight;
                container.innerHTML += `
                    <div class="flex space-x-2 items-center bg-slate-800/40 p-2 rounded-xl border border-slate-700/50">
                        <input type="text" value="${prize.name}" id="prize_name_${index}" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-cyan-500">
                        <input type="number" value="${prize.weight}" id="prize_weight_${index}" oninput="calculateTotalPercentage()" class="w-20 bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-cyan-500 text-center" placeholder="%">
                        <span class="text-xs text-slate-400">%</span>
                    </div>
                `;
            });

            document.getElementById('totalPercentage').innerText = totalP + '%';
            document.getElementById('totalSpins').innerText = totalSpins;
        }

        function calculateTotalPercentage() {
            let total = 0;
            prizes.forEach((_, index) => {
                let val = parseInt(document.getElementById(`prize_weight_${index}`).value) || 0;
                total += val;
            });
            let totalEl = document.getElementById('totalPercentage');
            totalEl.innerText = total + '%';
            totalEl.style.color = total === 100 ? '#22d3ee' : '#f87171';
        }

        // Simpan Pengaturan Admin
        function saveSettings() {
            let newPrizes = [];
            let total = 0;
            const colors = ["#06b6d4", "#334155", "#8b5cf6", "#0284c7", "#475569", "#0d9488", "#4f46e5"];

            prizes.forEach((_, index) => {
                let name = document.getElementById(`prize_name_${index}`).value;
                let weight = parseInt(document.getElementById(`prize_weight_${index}`).value) || 0;
                newPrizes.push({ name, weight, color: colors[index % colors.length] });
                total += weight;
            });

            if (total !== 100) {
                alert("Total persentase harus pas 100%!");
                return;
            }

            prizes = newPrizes;
            localStorage.setItem('namz_prizes', JSON.stringify(prizes));
            closeAdmin();
            drawWheel();
            alert("Pengaturan berhasil disimpan!");
        }

        function resetDefault() {
            if (confirm("Kembalikan ke pengaturan awal?")) {
                prizes = defaultPrizes;
                localStorage.removeItem('namz_prizes');
                renderAdminInputs();
                drawWheel();
                closeAdmin();
            }
        }

        // Gambar Roda Spin
        function drawWheel() {
            let totalWeight = prizes.reduce((sum, p) => sum + p.weight, 0);
            let currentAngle = 0;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let center = canvas.width / 2;
            let radius = center - 10;

            prizes.forEach((prize) => {
                let sliceAngle = (prize.weight / totalWeight) * 2 * Math.PI;

                ctx.beginPath();
                ctx.fillStyle = prize.color;
                ctx.moveTo(center, center);
                ctx.arc(center, center, radius, currentAngle, currentAngle + sliceAngle);
                ctx.lineTo(center, center);
                ctx.fill();
                ctx.save();

                // Teks pada Wheel
                ctx.translate(center, center);
                ctx.rotate(currentAngle + sliceAngle / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 11px 'Plus Jakarta Sans', sans-serif";
                ctx.fillText(prize.name, radius - 15, 4);
                ctx.restore();

                currentangle = currentAngle += sliceAngle;
            });
        }

        // Fungsi Putar Roda
        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            document.getElementById('resultBox').classList.add('hidden');

            let totalWeight = prizes.reduce((sum, p) => sum + p.weight, 0);
            let randomWeight = Math.random() * totalWeight;
            let cumulativeWeight = 0;
            let winningIndex = 0;

            for (let i = 0; i < prizes.length; i++) {
                cumulativeWeight += prizes[i].weight;
                if (randomWeight <= cumulativeWeight) {
                    winningIndex = i;
                    break;
                }
            }

            // Hitung derajat rotasi agar berhenti di hadiah terpilih
            let sliceAngles = prizes.map(p => (p.weight / totalWeight) * 360);
            let targetAngle = 0;
            for (let i = 0; i < winningIndex; i++) {
                targetAngle += sliceAngles[i];
            }
            targetAngle += sliceAngles[winningIndex] / 2;

            let extraSpins = 360 * 5; // Putar 5 kali putaran penuh
            let totalRotation = extraSpins + (360 - targetAngle);

            startAngle += totalRotation;
            canvas.style.transform = `rotate(${startAngle}deg)`;

            setTimeout(() => {
                isSpinning = false;
                totalSpins++;
                localStorage.setItem('namz_total_spins', totalSpins);

                document.getElementById('winnerText').innerText = prizes[winningIndex].name;
                document.getElementById('resultBox').classList.remove('hidden');
            }, 4000);
        }

        // Inisialisasi awal saat halaman dimuat
        drawWheel();
    </script>
</body>
</html>
